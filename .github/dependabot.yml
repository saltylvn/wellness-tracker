# Dependabot checks for package updates once a week and opens pull requests.
# Small (minor and patch) updates are grouped into one PR to keep things quiet;
# major updates come one at a time since they can need code changes.
# (Security fixes are opened right away, separately from this schedule.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
